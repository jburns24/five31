<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <pattern
      id="barbell-pattern"
      width="220"
      height="220"
      patternUnits="userSpaceOnUse"
    >
      <g
        opacity="0.14"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <!-- Bar -->
        <path d="M65 110 H155" />

        <!-- Outer plates (small) -->
        <rect x="43"  y="94" width="10" height="32" rx="2" />
        <rect x="167" y="94" width="10" height="32" rx="2" />

        <!-- Inner plates (big) -->
        <rect x="53"  y="88" width="12" height="44" rx="2" />
        <rect x="155" y="88" width="12" height="44" rx="2" />
      </g>
    </pattern>
  </defs>

  <!-- Fill canvas with the pattern -->
  <rect width="100%" height="100%" fill="url(#barbell-pattern)" />
</svg>
