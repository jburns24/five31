apiVersion: apps/v1
kind: Deployment
metadata:
  name: five31-workout-tracker
  labels:
    app: five31-workout-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: five31-workout-tracker
  template:
    metadata:
      labels:
        app: five31-workout-tracker
    spec:
      containers:
      - name: nextjs-app
        image: five31-workout-tracker:latest
        ports:
        - containerPort: 3000
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
        - name: OTEL_SERVICE_NAME
          value: "five31-workout-tracker"
        - name: GIT_SHA
          value: "{{ GIT_SHA }}"
        - name: NODE_ENV
          value: "production"
        - name: OTEL_LOG_LEVEL
          value: "info"
        - name: OTEL_SAMPLING_SLOW_THRESHOLD_MS
          value: "2000"
        - name: OTEL_SAMPLING_SUCCESS_RATE
          value: "0.1"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: five31-workout-tracker
spec:
  selector:
    app: five31-workout-tracker
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
