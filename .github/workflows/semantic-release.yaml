name: release-please

on:
  push:
    branches:
      - master

permissions:
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.0.0
        id: octo-sts
        with:
          scope: jburns24/five31
          identity: release-please
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Using octo-sts to get a temporarty token. Needed so this workflow
          # will trigger other workflows (ie: the tag pushed by this workflow will trigger release.yaml)
          token: ${{ steps.octo-sts.outputs.token }}
